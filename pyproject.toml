[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nlq-gateway"
version = "0.1.0"
description = "Schema-driven, zero-hallucination natural language to structured filter translation service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "NLQ Gateway Team" },
]
keywords = ["nlp", "filters", "laya", "mlx", "natural-language", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "laya-mlx>=0.2.0",
    "dateparser>=1.2.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
]
cache = [
    "redis>=5.0.0",
    "sentence-transformers>=2.2.0",
]
jev = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/divyam2207/nlq-gateway"
Documentation = "https://github.com/divyam2207/nlq-gateway/tree/main/docs"
Repository = "https://github.com/divyam2207/nlq-gateway"
Issues = "https://github.com/divyam2207/nlq-gateway/issues"

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
